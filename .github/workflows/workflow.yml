name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config gettext \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'

      - name: 安装 Buildozer 和 Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 手动 clone p4a master 并 patch pip 升级
        working-directory: app
        run: |
          set -e
          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          rm -rf "$P4A_DIR"

          echo ">>> 克隆 p4a master 分支..."
          git clone --depth=1 -b master \
            https://github.com/kivy/python-for-android.git "$P4A_DIR"

          cd "$P4A_DIR"

          echo ">>> 打印目标行:"
          sed -n '870,890p' pythonforandroid/build.py

          echo ">>> 应用补丁..."
          python3 << 'PYEOF'
          import sys

          path = "pythonforandroid/build.py"
          with open(path, "r") as f:
              src = f.read()

          old = '"source venv/bin/activate && pip install -U pip"'
          new = '"source venv/bin/activate"'

          if old not in src:
              print("❌ 未找到目标代码")
              sys.exit(1)

          src = src.replace(old, new)
          with open(path, "w") as f:
              f.write(src)

          print("✅ 补丁成功")
          PYEOF

          echo ">>> 验证:"
          sed -n '870,890p' pythonforandroid/build.py

      - name: 缓存 Buildozer 产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-

      - name: 打包 APK
        working-directory: app
        run: |
          yes | buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/bin/*.apk