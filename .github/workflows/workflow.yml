name: Diagnose p4a

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 克隆 p4a 并全面诊断
        working-directory: app
        run: |
          set +e   # 允许命令失败，不中断

          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          rm -rf "$P4A_DIR"

          echo ">>> 克隆 p4a..."
          git clone https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"

          echo ""
          echo "=========================================="
          echo "A. p4a 版本信息"
          echo "=========================================="
          git log -1 --format="commit=%H%ndate=%ci%nsubject=%s"
          git describe --tags 2>/dev/null || echo "(no tag)"
          echo "--- 分支 ---"
          git branch -a | head -20

          echo ""
          echo "=========================================="
          echo "B. 全局搜索 'pip install -U pip'"
          echo "=========================================="
          grep -rn "pip install -U pip" . --include="*.py" 2>/dev/null
          echo "退出码: $?"

          echo ""
          echo "=========================================="
          echo "C. 全局搜索 'source venv'"
          echo "=========================================="
          grep -rn "source venv" . --include="*.py" 2>/dev/null
          echo "退出码: $?"

          echo ""
          echo "=========================================="
          echo "D. 全局搜索 'activate && pip'（新旧写法都查）"
          echo "=========================================="
          grep -rn "activate.*pip" . --include="*.py" 2>/dev/null
          echo "退出码: $?"

          echo ""
          echo "=========================================="
          echo "E. run_pymodules_install 函数当前完整实现"
          echo "=========================================="
          awk '/^def run_pymodules_install/,/^def [a-z]/' \
            pythonforandroid/build.py | head -100

          echo ""
          echo "=========================================="
          echo "F. python3 recipe 源码"
          echo "=========================================="
          echo "--- pythonforandroid/recipes/python3/__init__.py ---"
          head -120 pythonforandroid/recipes/python3/__init__.py 2>/dev/null || echo "(不存在)"

          echo ""
          echo "=========================================="
          echo "G. hostpython3 recipe 源码"
          echo "=========================================="
          echo "--- pythonforandroid/recipes/hostpython3/__init__.py ---"
          cat pythonforandroid/recipes/hostpython3/__init__.py 2>/dev/null || echo "(不存在)"

          echo ""
          echo "=========================================="
          echo "H. 所有 recipe 里包含 'pip install' 的文件"
          echo "=========================================="
          grep -rln "pip install" pythonforandroid/recipes/ --include="*.py" 2>/dev/null

          echo ""
          echo "=========================================="
          echo "I. 所有 recipe 里包含 'venv' 的文件"
          echo "=========================================="
          grep -rln "venv" pythonforandroid/recipes/ --include="*.py" 2>/dev/null

          echo ""
          echo "=========================================="
          echo "J. hostpython3 recipe 里所有含 'pip' 的行"
          echo "=========================================="
          grep -rn "pip" pythonforandroid/recipes/hostpython3/ --include="*.py" 2>/dev/null

          echo ""
          echo "=========================================="
          echo "K. python3 recipe 里所有含 'pip' 的行"
          echo "=========================================="
          grep -rn "pip" pythonforandroid/recipes/python3/ --include="*.py" 2>/dev/null

          echo ""
          echo "=== 诊断完成 ==="