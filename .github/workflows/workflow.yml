name: Diagnose p4a master

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 克隆 p4a master 分支并诊断
        working-directory: app
        run: |
          set +e

          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          rm -rf "$P4A_DIR"

          echo ">>> 克隆 p4a 的 master 分支..."
          git clone -b master https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"

          echo ""
          echo "=========================================="
          echo "A. master 分支版本"
          echo "=========================================="
          git log -1 --format="commit=%H%ndate=%ci%nsubject=%s"

          echo ""
          echo "=========================================="
          echo "B. master 里 'pip install -U pip' 的所在"
          echo "=========================================="
          grep -rn "pip install -U pip" . --include="*.py"

          echo ""
          echo "=========================================="
          echo "C. master 里 'source venv' 的所在"
          echo "=========================================="
          grep -rn "source venv" . --include="*.py"

          echo ""
          echo "=========================================="
          echo "D. master 的 run_pymodules_install 函数（前后各50行）"
          echo "=========================================="
          grep -n "def run_pymodules_install" pythonforandroid/build.py

          echo ""
          echo "--- 850-920 行 ---"
          sed -n '850,920p' pythonforandroid/build.py

          echo ""
          echo "=========================================="
          echo "E. master 的 hostpython3 recipe 完整源码"
          echo "=========================================="
          cat pythonforandroid/recipes/hostpython3/__init__.py

          echo ""
          echo "=========================================="
          echo "F. master 的 python3 recipe 关键片段（version 和 pip 相关）"
          echo "=========================================="
          grep -n "version\|pip\|ensurepip\|3\.1" pythonforandroid/recipes/python3/__init__.py | head -30

          echo ""
          echo "=== 诊断完成 ==="
          exit 0