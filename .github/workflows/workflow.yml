name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 用 Buildozer 打包
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: app
          buildozer_version: master

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.buildozer.outputs.filename }}