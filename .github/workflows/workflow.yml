name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包 APK
        working-directory: app
        run: |
          yes | buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/bin/*.apk