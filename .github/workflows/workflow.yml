name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config gettext \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'

      - name: 安装 Buildozer 和 Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 诊断 p4a 代码结构
        working-directory: app
        run: |
          set -e
          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"

          if [ ! -d "$P4A_DIR" ]; then
            echo ">>> 克隆 p4a..."
            git clone --depth=1 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi

          cd "$P4A_DIR"

          echo ""
          echo "=========================================="
          echo "1. build.py 里包含 'pip' 的所有行:"
          echo "=========================================="
          grep -n "pip" pythonforandroid/build.py || echo "(无匹配)"

          echo ""
          echo "=========================================="
          echo "2. build.py 里包含 'venv' 的所有行:"
          echo "=========================================="
          grep -n "venv" pythonforandroid/build.py || echo "(无匹配)"

          echo ""
          echo "=========================================="
          echo "3. run_pymodules_install 函数完整内容:"
          echo "=========================================="
          LINE=$(grep -n "def run_pymodules_install" pythonforandroid/build.py | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$LINE
            END=$((LINE + 80))
            sed -n "${START},${END}p" pythonforandroid/build.py
          else
            echo "(未找到该函数)"
          fi

          echo ""
          echo "=========================================="
          echo "4. p4a 当前 commit:"
          echo "=========================================="
          git log -1 --oneline

          # 强制退出码 0，避免诊断失败卡住构建
          exit 0

      # 下面的步骤先注释掉，等诊断结果
      # - name: 缓存 Buildozer 产物
      #   ...

      - name: 缓存 Buildozer 产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: 打包 APK
        working-directory: app
        run: |
          yes | buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/bin/*.apk