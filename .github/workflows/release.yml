name: Release

# 两条发布路径，本 workflow 自己负责构建，不依赖 Build APK 的自动产物。
#
#   1. push 改了 app/ → 自动构建（debug 签名）→ 发 Prerelease（tag: build-<sha>）
#   2. 手动填版本号 → 重新构建（release 签名）→ 发正式 Release 并设为 latest

on:
  push:
    branches: [ master, main ]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号（如 v1.0.0）。填了才发正式版'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 平时 push：debug 构建 + 预发布 ----------
  prerelease:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    with:
      sign: debug
    secrets: inherit

  publish-prerelease:
    needs: prerelease
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 准备版本号
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=build-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag: build-${SHA_SHORT}"

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: 命名并校验
        run: |
          set -e
          cd dist
          APK=$(ls *.apk | head -1)
          mv "$APK" "Fake_GPS_${{ steps.meta.outputs.tag }}.apk"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fake_GPS ${{ steps.meta.outputs.tag }}
          prerelease: true
          make_latest: 'false'
          body: |
            ## 预发布（自动构建）

            签名：**调试证书**，仅供测试。与正式版无法互相覆盖安装。

            ### 安装

            1. 下载下方 APK 并安装
            2. 在开发者选项中将本应用设为「模拟位置信息应用」
            3. 打开应用，填写 PC 端 IP 和端口，点击「启动服务」

            ### 来源

            提交 `${{ github.sha }}`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

  # ---------- 手动发版：release 构建 + 正式发布 ----------
  stable:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    with:
      sign: release
      version: ${{ inputs.version }}
    secrets: inherit

  publish-stable:
    needs: stable
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 规整版本号
        id: meta
        run: |
          VER="${{ inputs.version }}"
          case "$VER" in
            v*) TAG="$VER" ;;
            *)  TAG="v$VER" ;;
          esac
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag: $TAG"

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: 校验签名
        run: |
          set -e
          cd dist
          APK=$(ls *.apk | head -1)
          echo "=== $APK ==="

          # v2/v3 签名不在 META-INF 里，必须用 apksigner 判断
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SIGNER" ]; then
            echo "使用 apksigner: $SIGNER"
            if ! "$SIGNER" verify --verbose --print-certs "$APK"; then
              echo "::error::$APK 签名校验失败"
              exit 1
            fi
            CERT=$("$SIGNER" verify --print-certs "$APK" 2>/dev/null)
          else
            # 兜底：至少确认有 v2 签名的魔术字节
            if ! grep -qa "APK Sig Block 42" "$APK"; then
              echo "::error::未检测到 APK 签名块"
              exit 1
            fi
            echo "未找到 apksigner，仅检测到签名块"
            CERT=""
          fi

          if echo "$CERT" | grep -qi "Android Debug"; then
            echo "::error::这是调试签名，不能作为正式版发布"
            exit 1
          fi

          echo "签名校验通过（非调试证书）"
          echo "$CERT" | grep -iE "Signer #1 certificate DN|SHA-256 digest" || true

      - name: 命名并校验
        run: |
          set -e
          cd dist
          APK=$(ls *.apk | head -1)
          mv "$APK" "Fake_GPS_${{ steps.meta.outputs.tag }}.apk"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布正式版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fake_GPS ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
          body: |
            ## 正式版 ${{ steps.meta.outputs.tag }}

            签名：**正式证书**，可直接覆盖安装升级。

            ### 安装

            1. 下载下方 APK 并安装
            2. 在开发者选项中将本应用设为「模拟位置信息应用」
            3. 打开应用，填写 PC 端 IP 和端口，点击「启动服务」

            ### PC 端

            ```bash
            cd server
            python main.py
            ```

            浏览器打开 `http://127.0.0.1:8000`，在网页中选择 GPX 路径、设置速度和目标 IP。

            ### 校验

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 版本

            versionName `${{ steps.meta.outputs.version }}`，
            提交 `${{ github.sha }}`。
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt