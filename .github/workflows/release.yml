name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（例如 v1.0.0），留空则使用最新 tag'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v$(date +%Y.%m.%d)-manual"
          fi
          echo "value=$VER" >> $GITHUB_OUTPUT
          echo "版本号: $VER"

      - name: 同步版本号到 buildozer.spec
        run: |
          VER="${{ steps.version.outputs.value }}"
          # v1.2.3 -> 1.2.3；非法格式则回落到日期
          SEMVER=$(echo "$VER" | sed -E 's/^v//')
          if ! echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            SEMVER="0.0.$(date +%Y%m%d)"
          fi
          echo "APK versionName: $SEMVER"
          python3 - "$SEMVER" <<'PY'
          import re, sys
          ver = sys.argv[1]
          path = 'app/buildozer.spec'
          src = open(path, encoding='utf-8').read()
          new, n = re.subn(r'(?m)^version\s*=.*$', f'version = {ver}', src)
          assert n == 1, 'version 行数量异常'
          open(path, 'w', encoding='utf-8').write(new)
          print('已写入 version =', ver)
          PY
          grep -E '^(title|package\.name|package\.domain|version|icon\.|presplash\.)' app/buildozer.spec

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/node
          sudo apt-get clean
          df -h /

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config gettext \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'

      - name: 切换到 Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "PATH=/usr/lib/jvm/temurin-17-jdk-amd64/bin:$PATH" >> $GITHUB_ENV
          java -version

      - name: 安装 Buildozer 和 Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 手动 clone p4a master 并 patch pip 升级
        working-directory: app
        run: |
          set -e
          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          rm -rf "$P4A_DIR"
          git clone --depth=1 -b master \
            https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"
          python3 -c "
          path = 'pythonforandroid/build.py'
          src = open(path).read()
          old = '\"source venv/bin/activate && pip install -U pip\"'
          new = '\"source venv/bin/activate\"'
          assert old in src, '目标代码未找到'
          open(path, 'w').write(src.replace(old, new))
          print('补丁成功')
          "

      - name: 恢复 Buildozer 缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-release-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-release-
            buildozer-

      - name: 打包 APK
        working-directory: app
        run: |
          yes | buildozer android debug

      - name: 保存 Buildozer 缓存
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-release-${{ hashFiles('app/buildozer.spec') }}

      - name: 整理产物
        run: |
          mkdir -p dist
          for f in app/bin/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .apk)
            cp "$f" "dist/Fake_GPS_${{ steps.version.outputs.value }}.apk"
            echo "已打包: dist/Fake_GPS_${{ steps.version.outputs.value }}.apk"
          done
          ls -lh dist/

      - name: 生成校验和
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Fake_GPS ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 说明

            Android 定位模拟工具，通过 PC 端发送坐标，手机端注入系统定位。

            ### 安装

            1. 下载下方 APK 并安装
            2. 在开发者选项中将本应用设为「模拟位置信息应用」
            3. 打开应用，填写 PC 端 IP 和端口，点击「启动服务」

            ### PC 端

            ```bash
            cd server
            python main.py
            ```

            浏览器打开 `http://127.0.0.1:8000`，在网页中选择 GPX 路径、设置速度和目标 IP。

            ### 校验

            下载 `SHA256SUMS.txt` 后执行：

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 版本

            本次构建基于提交 `${{ github.sha }}`。
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

  verify-release:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 确认 Release 已发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release 已创建：${{ github.server_url }}/${{ github.repository }}/releases"