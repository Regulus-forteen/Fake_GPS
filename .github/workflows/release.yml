name: Release

# 只负责把已构建好的 APK 发布成 Release，不重复编译。
# APK 由 workflow.yml 在 push 到 master 时构建并上传为 artifact（名为 apk）。

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v0.1.0）；留空则自动生成'
        required: false
        type: string
      run_id:
        description: '指定要取 artifact 的 Build APK run id；留空则取最近一次成功的'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # workflow_run 触发时，只在上游构建成功时执行
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号与来源 run
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # ---- 版本号 ----
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 用上游构建的短 SHA 做默认版本，避免重复 tag
            SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            TAG="build-${SHA_SHORT}"
          else
            TAG="build-$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "版本号: $TAG"

          # ---- 来源 run id ----
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            # 手动触发：取 master 上最近一次成功的 Build APK
            RUN_ID=$(gh run list \
              --workflow="Build APK" \
              --branch=master \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "找不到可用的构建记录" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "来源 run: $RUN_ID"

      - name: 下载已构建的 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p dist
          gh run download "${{ steps.meta.outputs.run_id }}" \
            --name apk \
            --dir dist
          echo "下载完成："
          ls -lh dist/

      - name: 重命名并生成校验和
        run: |
          set -e
          cd dist
          for f in *.apk; do
            [ -e "$f" ] || { echo "没有找到 APK" >&2; exit 1; }
            mv "$f" "Fake_GPS_${{ steps.meta.outputs.tag }}.apk"
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fake_GPS ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载下方 APK 并安装
            2. 在开发者选项中将本应用设为「模拟位置信息应用」
            3. 打开应用，填写 PC 端 IP 和端口，点击「启动服务」

            ## PC 端

            ```bash
            cd server
            python main.py
            ```

            浏览器打开 `http://127.0.0.1:8000`，在网页中选择 GPX 路径、设置速度和目标 IP。

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ## 来源

            本次 APK 来自构建 run `${{ steps.meta.outputs.run_id }}`，
            对应提交 `${{ github.event.workflow_run.head_sha || github.sha }}`。
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: 输出结果
        run: |
          echo "Release 已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}"