name: Make Keystore

# 在 GitHub 上生成发布签名用的 keystore，避免本地装 JDK。
# 跑完把 artifact 下载下来，自己保存 keystore 和密码，再把 4 个值填进 Secrets。
#
# 用途：只跑一次。之后不需要再跑。

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'keystore 密码（至少 8 位，留空自动生成）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest

    steps:
      - name: 生成 keystore
        id: gen
        run: |
          set -e
          PW="${{ inputs.password }}"
          if [ -z "$PW" ]; then
            PW=$(python3 -c "import secrets;print(secrets.token_urlsafe(18))")
          fi
          if [ ${#PW} -lt 8 ]; then
            echo "::error::密码至少 8 位"
            exit 1
          fi

          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias fakegps \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Regulus, OU=Release, O=regulus14.top, C=CN" \
            -storetype JKS

          echo "keystore 大小: $(stat -c%s out/release.keystore) 字节"

          base64 -w0 out/release.keystore > out/keystore_base64.txt
          echo "base64 长度: $(wc -c < out/keystore_base64.txt)"

          # 打印证书指纹，便于核对
          keytool -list -v -keystore out/release.keystore -storepass "$PW" -alias fakegps \
            | grep -E "SHA256:|Alias name:|Valid" | head -5

          echo "$PW" > out/password.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 7

      - name: 提示
        run: |
          echo "## 下载下方 artifact「keystore」" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "里面有 3 个文件：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 用途 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`release.keystore\` | **长期保存**，丢了无法发布更新 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`keystore_base64.txt\` | 填进 Secret \`KEYSTORE_BASE64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`password.txt\` | 填进 Secret \`KEYSTORE_PASSWORD\` 和 \`KEY_PASSWORD\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`KEY_ALIAS\` 填 \`fakegps\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "填完这 4 个 Secret，**把这个 workflow 文件和 artifact 都删掉**。" >> $GITHUB_STEP_SUMMARY